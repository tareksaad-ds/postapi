{% extends "layout.html" %}
{% block content %}
  <article class="content-section py-3 px-4 mb-4">
    <h1>Account</h1>
    <p class="article-content" id="accountInfo">Loading...</p>
  </article>
{% endblock content %}
{% block scripts %}
<script type="module">
  import { getCurrentUser } from '/static/js/auth.js';
  const user = await getCurrentUser();
  if (!user) { window.location.href = '/login'; }
  else {
    document.getElementById('accountInfo').textContent = `${user.username} (${user.email})`;
  }
</script>
{% endblock scripts %}
